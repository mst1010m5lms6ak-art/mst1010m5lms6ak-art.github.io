<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="はちゃめちゃ世界">
  <meta name="format-detection" content="telephone=no">
  <title>はちゃめちゃ世界</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div id="app-shell">
    <div id="app-frame">
      <!-- 画面上部: 視認・情報表示専用領域 -->
      <section id="upper-zone" aria-label="表示エリア">
        <header id="top-bar"></header>
        <div id="upper-content"></div>
      </section>

      <div id="chaos-divider" aria-hidden="true"></div>

      <!-- 画面下部: 操作領域 -->
      <section id="lower-zone" aria-label="操作エリア">
        <div id="lower-content"></div>
        <nav id="bottom-nav" aria-label="メニュー"></nav>
      </section>

      <!-- ボトムシート（操作ボタンは全て下部に配置） -->
      <div id="sheet-backdrop" class="hidden"></div>
      <div id="bottom-sheet" class="hidden" role="dialog" aria-modal="true"></div>

      <!-- トースト通知 -->
      <div id="toast-box" aria-live="polite"></div>

      <!-- ドラッグ中ゴースト -->
      <div id="drag-ghost" class="hidden" aria-hidden="true"></div>
    </div>
  </div>

  <!-- コアモジュール -->
  <script defer src="./js/core/constants.js"></script>
  <script defer src="./js/core/utils.js"></script>
  <script defer src="./js/core/storage.js"></script>
  <script defer src="./js/core/audio.js"></script>

  <!-- ゲームデータ -->
  <script defer src="./js/data/units.js"></script>
  <script defer src="./js/data/stages.js"></script>
  <script defer src="./js/data/equipment.js"></script>

  <!-- ゲームロジック・描画 -->
  <script defer src="./js/game/state.js"></script>
  <script defer src="./js/game/combat.js"></script>
  <script defer src="./js/game/renderer.js"></script>

  <!-- UIモジュール -->
  <script defer src="./js/ui/dragdrop.js"></script>
  <script defer src="./js/ui/render-battle.js"></script>
  <script defer src="./js/ui/render-party.js"></script>
  <script defer src="./js/ui/render-units.js"></script>
  <script defer src="./js/ui/render-gear.js"></script>
  <script defer src="./js/ui/render-codex.js"></script>
  <script defer src="./js/ui/render-world.js"></script>

  <!-- エントリポイント -->
  <script defer src="./js/main.js"></script>
</body>
</html>
