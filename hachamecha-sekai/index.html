<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor://localhost http://localhost http://127.0.0.1; script-src 'self' capacitor://localhost http://localhost http://127.0.0.1; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
  <meta name="theme-color" content="#0d111a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="境界回廊">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>境界回廊：クロノ・レゾナンス</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/style.css?v=2">
</head>
<body>
  <div id="app-shell" class="app-shell" data-hand="right" data-contrast="normal" data-motion="full">
    <section id="stage-top" class="stage-top" aria-label="表示領域">
      <header id="top-hud" class="top-hud"></header>
      <div id="top-stage-body" class="top-stage-body">
        <div id="battle-viewport" class="battle-viewport">
          <canvas id="battle-canvas" class="battle-canvas"></canvas>
          <div id="battle-overlay" class="battle-overlay"></div>
        </div>
        <div id="inspect-viewport" class="inspect-viewport hidden"></div>
      </div>
      <div id="top-modal-stage" class="top-modal-stage hidden"></div>
      <div id="toast-banner" class="toast-banner hidden" aria-live="polite"></div>
    </section>

    <div id="deck-divider" class="deck-divider" aria-hidden="true">
      <span id="divider-left" class="divider-tag"></span>
      <span id="divider-center" class="divider-ticker"></span>
      <span id="divider-right" class="divider-tag"></span>
    </div>

    <section id="deck-bottom" class="deck-bottom" aria-label="操作領域">
      <div id="bottom-panel-body" class="bottom-panel-body"></div>
      <div id="bottom-modal-deck" class="bottom-modal-deck hidden"></div>
      <nav id="bottom-nav" class="bottom-nav" aria-label="メインメニュー"></nav>
    </section>
  </div>

  <script defer src="./js/security.js?v=2"></script>
  <script defer src="./js/audio.js?v=2"></script>
  <script defer src="./js/data/realms.js?v=2"></script>
  <script defer src="./js/data/units.js?v=2"></script>
  <script defer src="./js/data/stages.js?v=2"></script>
  <script defer src="./js/data/relics.js?v=2"></script>
  <script defer src="./js/data/achievements.js?v=2"></script>
  <script defer src="./js/engine/state.js?v=2"></script>
  <script defer src="./js/engine/vfx.js?v=2"></script>
  <script defer src="./js/engine/battle.js?v=2"></script>
  <script defer src="./js/ui/renderer.js?v=2"></script>
  <script defer src="./js/main.js?v=2"></script>
</body>
</html>
