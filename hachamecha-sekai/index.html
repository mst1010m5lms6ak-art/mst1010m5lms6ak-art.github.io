<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="はちゃめちゃ世界">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="format-detection" content="telephone=no">
  <title>はちゃめちゃ世界</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/battle.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div id="safe-probe-top" class="safe-probe" aria-hidden="true"></div>
  <div id="safe-probe-bottom" class="safe-probe" aria-hidden="true"></div>
  <div class="bg-canvas" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-orb bg-orb-a"></div>
    <div class="bg-orb bg-orb-b"></div>
  </div>

  <div id="app-shell" class="app-shell">
    <header id="top-bar" class="top-bar" aria-label="ステータス表示"></header>
    <main id="screen-root" class="screen-root"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="メインメニュー"></nav>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden>
    <section id="sheet-panel" class="sheet-panel" role="dialog" aria-modal="true"></section>
  </div>
  <div id="toast-layer" class="toast-layer" aria-live="polite"></div>

  <script defer src="./js/core/namespace.js"></script>
  <script defer src="./js/core/dom.js"></script>
  <script defer src="./js/core/storage.js"></script>
  <script defer src="./js/core/pwa.js"></script>

  <script defer src="./js/data/abilities.js"></script>
  <script defer src="./js/data/characters.js"></script>
  <script defer src="./js/data/equipment.js"></script>
  <script defer src="./js/data/enemies.js"></script>
  <script defer src="./js/data/stages.js"></script>

  <script defer src="./js/engine/state.js"></script>
  <script defer src="./js/engine/stats.js"></script>
  <script defer src="./js/engine/battle.js"></script>

  <script defer src="./js/ui/battleView.js"></script>
  <script defer src="./js/ui/deployView.js"></script>
  <script defer src="./js/ui/partyView.js"></script>
  <script defer src="./js/ui/growthView.js"></script>
  <script defer src="./js/ui/equipView.js"></script>
  <script defer src="./js/ui/archiveView.js"></script>
  <script defer src="./js/ui/app.js"></script>
</body>
</html>
