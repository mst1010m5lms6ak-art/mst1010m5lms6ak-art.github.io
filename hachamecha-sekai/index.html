<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="はちゃめちゃ世界">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0914">
  <meta name="format-detection" content="telephone=no">
  <title>はちゃめちゃ世界</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/battle.css">
</head>
<body>
  <div id="app-root">
    <div id="app-shell">
      <section id="top-display" aria-label="表示領域"></section>
      <section id="bottom-control" aria-label="操作領域">
        <div id="control-body"></div>
        <nav id="bottom-nav" aria-label="メニュー"></nav>
      </section>
      <div id="sheet-overlay" class="hidden" aria-hidden="true">
        <div id="sheet-backdrop"></div>
        <div id="sheet-panel" role="dialog" aria-modal="true"></div>
      </div>
      <div id="toast-layer" aria-live="polite"></div>
    </div>
  </div>
  <div id="drag-ghost" class="hidden" aria-hidden="true"></div>

  <script defer src="./js/constants.js"></script>
  <script defer src="./js/data-characters.js"></script>
  <script defer src="./js/data-stages.js"></script>
  <script defer src="./js/data-equip.js"></script>
  <script defer src="./js/storage.js"></script>
  <script defer src="./js/audio.js"></script>
  <script defer src="./js/ui-svg.js"></script>
  <script defer src="./js/ui-drag.js"></script>
  <script defer src="./js/battle-fx.js"></script>
  <script defer src="./js/battle-engine.js"></script>
  <script defer src="./js/ui-battle.js"></script>
  <script defer src="./js/ui-screens.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
